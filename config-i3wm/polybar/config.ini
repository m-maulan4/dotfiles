[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/top]
width = 100%
height = 18pt
radius = 6
dpi = 96
fixed-center = true
padding-right = 1
background = ${colors.background}
foreground = ${colors.foreground}

border-size = 8
border-color = #00000000

font-0 = "monospace:size=10;2"
font-1 = "Font Awesome 7 Free Solid:size=10;2"
font-2 = "Font Awesome 7 Brands:size=10;2"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = pulseaudio memory cpu wlan eth systray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

separator = " | "
separator-foreground = ${colors.disabled}
enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

;override-redirect = true

;##############
; Module
;##############

[module/systray]
type = internal/tray
tray-size = 50%
tray-spacing = 6pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = custom/script
exec = ~/.config/polybar/scripts/active-window.sh
interval = 1
format = <label>
label = %output%
label-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = " Muted"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = <label-connected>
format-disconnected = <label-disconnected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.disabled}
label-connected = %essid%
label-disconnected = "N/A"


[module/eth]
inherit = network-base
interface-type = wired
format-connected = <label-connected>
format-disconnected = <label-disconnected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.disabled}
label-connected = %local_ip%
label-disconnected = "N/A"

[module/date]
type = internal/date
interval = 1

date = %d-%m-%Y %H:%M
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/powermenu]
type = custom/menu

expand-bottom = true

menu-0-2 = Shutdown
menu-0-2-exec = systemctl poweroff

menu-0-1 = Reboot
menu-0-1-exec = systemctl reboot

menu-0-0 = Logout
menu-0-0-exec = bspc quit

label-open = 
label-close = 
label-separator = " | "