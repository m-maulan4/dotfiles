include-file = ./colors.ini

[bar/top]
width = 100%
height = 18pt
radius = 6
dpi = 96
fixed-center = true
padding-right = 1
background = ${colors.background}
foreground = ${colors.foreground}

border-size = 8
border-color = #00000000

font-0 = "monospace:size=10;2"
font-1 = "Font Awesome 7 Free Solid:size=10;2"
font-2 = "Font Awesome 7 Brands:size=10;2"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = brightness pulseaudio memory cpu battery network systray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

separator = " | "
separator-foreground = ${colors.disabled}
enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

;override-redirect = true

;##############
; Module
;##############

[module/systray]
type = internal/tray
tray-size = 50%
tray-spacing = 6pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = custom/script
exec = ~/.config/polybar/scripts/active-window.sh
interval = 1
format = <label>
label = %output%
label-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = " Muted"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/network]
type = custom/script
exec = bash ~/.config/polybar/scripts/network-status.sh
interval = 3
format = <label>
label = %output%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d %b %Y - %H:%M
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/powermenu]
type = custom/menu
expand-bottom = true
menu-0-2 = Shutdown
menu-0-2-exec = systemctl poweroff
menu-0-1 = Reboot
menu-0-1-exec = systemctl reboot
menu-0-0 = Logout
menu-0-0-exec = bspc quit
label-open = 
label-close = 
label-separator = " | "

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 2
format-discharging = <label-discharging>
format-charging = <label-charging>
format-full = <label-full>
label-charging =  %percentage%%
label-discharging = %percentage%%
label-full =  %percentage%%
format-discharging-prefix = " " 
format-discharging-prefix-foreground = ${colors.primary}
format-charging-foreground = ${colors.secondary}
format-full-foreground = ${colors.primary}

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
interval = 1
scroll-up   = ~/.config/polybar/scripts/brightness.sh up
scroll-down = ~/.config/polybar/scripts/brightness.sh down
format = <label> 
format-prefix = "" 
format-prefix-foreground = ${colors.primary} 
label = %output%